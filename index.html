<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Barbara Barber Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: sticky store header (logo, search, stores, account, cart) over a hero, category tiles, filterable product grid, service strip and footer. Direction flips with the language. */
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-2: #eaf0f7;
  --ink: #12263f;
  --muted: #566a82;
  --line: #d7e0eb;
  --blue: #1c4b8c;
  --on-blue: #ffffff;
  --orange: #c9661a;
  --orange-ink: #a84d0a;
  --on-orange: #ffffff;
  --logo-bg: #ffffff;
  --shadow: 0 10px 30px rgba(18, 38, 63, .12);
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1520; --surface: #152233; --surface-2: #1c2d42; --ink: #e9eff8; --muted: #a0b1c7;
    --line: #27394f; --blue: #2f66b3; --on-blue: #ffffff; --orange: #e98a3f; --orange-ink: #f0a064;
    --on-orange: #1a0e03; --logo-bg: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1520; --surface: #152233; --surface-2: #1c2d42; --ink: #e9eff8; --muted: #a0b1c7;
  --line: #27394f; --blue: #2f66b3; --on-blue: #ffffff; --orange: #e98a3f; --orange-ink: #f0a064;
  --on-orange: #1a0e03; --logo-bg: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-inline: 0;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.hdr {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px 20px;
  padding-block: 12px;
}
.logo { display: block; background: var(--logo-bg); border-radius: 8px; padding: 4px 8px; flex: none; }
.logo img { height: 42px; width: auto; max-width: 100%; display: block; }

.search {
  display: flex; flex: 1 1 260px; max-width: 460px; min-width: 0;
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface);
}
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  padding: 10px 14px; font: inherit; font-size: 15px; outline: none;
}
.search input::placeholder { color: var(--muted); }
.search button {
  border: 0; background: var(--blue); color: var(--on-blue); width: 52px; display: grid; place-items: center;
}

.dd { position: relative; }
.stores-btn {
  display: flex; align-items: center; gap: 8px; background: transparent;
  border: 1.5px solid var(--blue); color: var(--blue); border-radius: 8px;
  padding: 8px 14px; font-weight: 700; font-family: var(--font-display); font-size: 14px; text-transform: uppercase;
  letter-spacing: .02em;
}
:root[data-theme="dark"] .stores-btn { color: #9cc2f5; border-color: #5b8fd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stores-btn { color: #9cc2f5; border-color: #5b8fd6; } }
.stores-btn[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.menu {
  position: absolute; inset-inline-start: 0; top: calc(100% + 8px); min-width: 250px; z-index: 40;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 8px; list-style: none; margin: 0;
}
.menu li { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 8px; }
.menu li:hover { background: var(--surface-2); }
.menu b { font-family: var(--font-display); font-size: 15px; }
.menu span { color: var(--muted); font-size: 13px; }

.hdr-spacer { flex: 1 1 0; }
.account {
  display: flex; align-items: center; gap: 10px; background: none; border: 0; text-align: start; padding: 4px;
}
.account .who { display: flex; flex-direction: column; line-height: 1.25; }
.account strong { font-family: var(--font-display); font-size: 16px; color: var(--blue); }
:root[data-theme="dark"] .account strong { color: #9cc2f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .account strong { color: #9cc2f5; } }
.account small { color: var(--muted); font-size: 13px; }
.account small i { font-style: normal; padding-inline: 6px; opacity: .5; }
.vr { width: 1px; align-self: stretch; background: var(--line); margin-block: 4px; }

.lang {
  display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2);
}
.lang button {
  border: 0; background: transparent; color: var(--muted); padding: 4px 14px; border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
}
.lang button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }

.cart-btn { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px; text-align: start; }
.cart-btn .lbl { display: flex; flex-direction: column; line-height: 1.25; }
.cart-btn strong { font-family: var(--font-display); font-size: 16px; color: var(--blue); }
:root[data-theme="dark"] .cart-btn strong { color: #9cc2f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cart-btn strong { color: #9cc2f5; } }
.cart-btn small { color: var(--muted); font-size: 13px; }
.cart-ico { position: relative; color: var(--blue); }
:root[data-theme="dark"] .cart-ico { color: #9cc2f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cart-ico { color: #9cc2f5; } }
.badge {
  position: absolute; top: -8px; inset-inline-end: -10px; min-width: 20px; height: 20px; padding-inline: 5px;
  background: var(--orange); color: var(--on-orange); border-radius: 999px; font: 700 12px/20px var(--font-display);
  text-align: center; font-variant-numeric: tabular-nums;
}

/* ---------- Hero ---------- */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.hero-in { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: center; padding-block: 48px 72px; }
.eyebrow {
  display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--orange-ink); margin-bottom: 12px;
}
.hero h1 { font-size: clamp(28px, 4.6vw, 48px); font-weight: 800; }
.hero p.lead { color: var(--muted); font-size: 18px; max-width: 52ch; margin-top: 16px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 12px 22px; text-decoration: none;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; border: 1.5px solid transparent;
}
.btn.primary { background: var(--orange); color: var(--on-orange); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: var(--blue); color: var(--blue); background: transparent; }
:root[data-theme="dark"] .btn.ghost { color: #9cc2f5; border-color: #5b8fd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ghost { color: #9cc2f5; border-color: #5b8fd6; } }
.btn.ghost:hover { background: var(--surface-2); }

.hero-card {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 22px; min-width: 0;
}
.hero-card h2 { font-size: 16px; margin-bottom: 12px; color: var(--muted); font-weight: 700; }
.hero-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hero-list li {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 12px; padding: 10px 12px;
  border: 1px solid var(--line);
}
.hero-list svg { color: var(--orange); flex: none; }
.hero-list b { font-family: var(--font-display); font-weight: 700; display: block; line-height: 1.3; }
.hero-list span { color: var(--muted); font-size: 14px; }
.wave { position: absolute; inset-inline: 0; bottom: -1px; width: 100%; height: 44px; }
.wave .w1 { fill: var(--orange); opacity: .9; }
.wave .w2 { fill: var(--blue); }
.wave .w3 { fill: var(--bg); }

/* ---------- Sections ---------- */
section { padding-block: 40px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-head h2 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
.sec-head p { color: var(--muted); }

.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.cat {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  font-family: var(--font-display); font-weight: 700;
}
.cat svg { color: var(--blue); }
:root[data-theme="dark"] .cat svg { color: #9cc2f5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cat svg { color: #9cc2f5; } }
.cat:hover { border-color: var(--orange); transform: translateY(-2px); }
.cat[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.cat[aria-pressed="true"] svg { color: var(--on-blue); }
.cat small { font-family: var(--font-body); font-weight: 400; color: var(--muted); }
.cat[aria-pressed="true"] small { color: color-mix(in srgb, var(--on-blue) 80%, transparent); }
@media (prefers-reduced-motion: no-preference) { .cat { transition: transform .15s, border-color .15s; } }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .pic { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; background: color-mix(in srgb, var(--tint) 14%, var(--surface)); color: var(--tint); }
.card .pic.t0 { --tint: var(--orange); }
.card .pic.t1 { --tint: var(--blue); }
:root[data-theme="dark"] .card .pic.t1 { --tint: #7fb0f0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .pic.t1 { --tint: #7fb0f0; } }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .tag { font-size: 12px; font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.card h3 { font-size: 16px; font-weight: 700; }
.card .row { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.price small { font-size: 13px; font-weight: 700; color: var(--muted); }
.add {
  border: 0; background: var(--blue); color: var(--on-blue); border-radius: 9px; padding: 8px 12px;
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 13px;
}
.add:hover { filter: brightness(1.12); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

.perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.perk { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.perk svg { color: var(--orange); flex: none; }
.perk b { font-family: var(--font-display); display: block; }
.perk span { color: var(--muted); font-size: 14px; }

footer { background: var(--ink); color: #e9eff8; margin-top: 24px; }
:root[data-theme="dark"] footer { background: #0a1018; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) footer { background: #0a1018; } }
.foot { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 28px; padding-block: 36px; }
.foot .logo { display: inline-block; margin-bottom: 12px; }
.foot h3 { font-size: 15px; margin-bottom: 10px; color: #fff; }
.foot p, .foot li { color: #b9c7da; font-size: 14px; }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.copy { border-top: 1px solid rgba(255, 255, 255, .12); padding-block: 14px; color: #93a5bc; font-size: 13px; }
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- Cart drawer ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 16, 28, .55); z-index: 50; }
.drawer {
  position: fixed; inset-block: 0; inset-inline-end: 0; width: min(420px, 100%); background: var(--surface); z-index: 60;
  display: flex; flex-direction: column; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); }
.drawer header h2 { font-size: 20px; }
.x { background: var(--surface-2); border: 0; border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; }
.lines { flex: 1; overflow-y: auto; padding: 8px 16px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.line b { font-family: var(--font-display); font-size: 15px; }
.line .p { font-variant-numeric: tabular-nums; font-weight: 700; font-family: var(--font-display); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; width: max-content; }
.qty button { background: none; border: 0; width: 32px; height: 32px; font-size: 18px; }
.qty span { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.rm { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; justify-self: end; }
.sum { padding: 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.sum .t { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.sum .btn { justify-content: center; border: 0; }
.note { font-size: 13px; color: var(--muted); }

.toast {
  position: fixed; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 80; font-weight: 500; box-shadow: var(--shadow);
}

@media (max-width: 900px) {
  .hero-in { grid-template-columns: 1fr; padding-block: 32px 64px; }
  .foot { grid-template-columns: 1fr; }
  .hdr-spacer { display: none; }
}
@media (max-width: 760px) {
  .search { order: 10; flex: 1 1 100%; max-width: none; }
  .hdr { justify-content: space-between; }
  .account .who small, .vr { display: none; }
  .cart-btn .lbl small { display: none; }
}
@media (max-width: 520px) {
  .logo img { height: 34px; }
  .account .who { display: none; }
  .cart-btn .lbl { display: none; }
  .stores-btn { padding: 8px 10px; font-size: 13px; }
}
</style>
<style>
[hidden] { display: none !important; }
.toast { pointer-events: none; }
.drawer .x { width: 44px; height: 44px; flex: none; }
/* Store extras (checkout, product images) and the always-dark admin dashboard */
:root { --st-pending: #a35f00; --st-ready: #1b7a47; --st-canceled: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --st-pending: #f0b23c; --st-ready: #4cc38a; --st-canceled: #ff8a80; } }
:root[data-theme="dark"] { --st-pending: #f0b23c; --st-ready: #4cc38a; --st-canceled: #ff8a80; }

.card .pic { overflow: hidden; }
.pimg { width: 100%; height: 100%; object-fit: cover; display: block; }
.dbody, .dform { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.drawer .lines { flex: 1; overflow-y: auto; padding: 12px 16px; }
.drawer .btn:disabled { opacity: .5; cursor: not-allowed; }
.sum .trow { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
.fld { display: grid; gap: 6px; margin-bottom: 14px; }
.fld label { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.fld input, .fld textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; resize: vertical; }
.fld input:focus, .fld textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
.fld input[aria-invalid="true"], .fld textarea[aria-invalid="true"] { border-color: var(--st-canceled); }
.err { color: var(--st-canceled); font-size: 13px; margin: 0; }
.done { padding: 28px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; overflow-y: auto; }
.done .okc { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: var(--st-ready); background: color-mix(in srgb, var(--st-ready) 16%, var(--surface)); }
.oid { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .04em; direction: ltr; }
.done .tot { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--ink); }
.btn.wa { background: #1a8a47; color: #fff; }
.btn.wa:hover { filter: brightness(1.08); }
.btn.sm { padding: 8px 14px; font-size: 14px; }
.sum .btn.sm { border: 1.5px solid var(--blue); }
.copy { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
.adm-link { background: none; border: 0; color: #93a5bc; text-decoration: underline; font-size: 13px; padding: 0; }
.adm-link:hover { color: #fff; }

/* ---------- admin (deliberately dark in both themes) ---------- */
body.is-admin { background: #0a1222; }
#adminApp {
  --a-bg: #0a1222; --a-panel: #101a30; --a-panel2: #16233f; --a-line: #223152; --a-ink: #e7eefb; --a-muted: #8ea2c2;
  --a-blue: #3b82f6; --a-blue-ink: #ffffff; --s-pending: #f5b544; --s-ready: #34d399; --s-canceled: #f87171; --s-returned: #a78bfa;
  background: var(--a-bg); color: var(--a-ink); color-scheme: dark; min-height: 100vh; font-family: var(--font-body);
}
#adminApp .mut { color: var(--a-muted); }
#adminApp h1, #adminApp h2 { font-family: var(--font-display); }
#adminApp [data-status="pending"] { --c: var(--s-pending); }
#adminApp [data-status="ready"] { --c: var(--s-ready); }
#adminApp [data-status="canceled"] { --c: var(--s-canceled); }
#adminApp [data-status="returned"] { --c: var(--s-returned); }

#adminApp .in { background: var(--a-panel); border: 1px solid var(--a-line); color: var(--a-ink); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px; min-width: 0; }
#adminApp .in:focus { outline: none; border-color: var(--a-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, .28); }
#adminApp .in::placeholder { color: var(--a-muted); }
#adminApp .ab { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 9px 16px; font-family: var(--font-display); font-weight: 700; font-size: 14px; border: 1px solid transparent; background: transparent; color: var(--a-ink); text-decoration: none; }
#adminApp .ab.sm { padding: 6px 12px; font-size: 13px; }
#adminApp .ab.pri { background: var(--a-blue); color: var(--a-blue-ink); }
#adminApp .ab.pri:hover { filter: brightness(1.1); }
#adminApp .ab.ghost { border-color: var(--a-line); background: var(--a-panel); }
#adminApp .ab.ghost:hover { background: var(--a-panel2); }
#adminApp .ab.dng { border-color: color-mix(in srgb, var(--s-canceled) 55%, transparent); color: var(--s-canceled); }
#adminApp .ab.dng.on { background: var(--s-canceled); color: #2a0805; border-color: var(--s-canceled); }
#adminApp .ab:disabled { opacity: .5; cursor: not-allowed; }

  function setStatus(id, status, selEl) {
    var o = S.adm.orders.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    var old = o.status; o.status = status; if (selEl) selEl.dataset.status = status;
    DB.setStatus(id, status).then(function () { toast(t("saved")); }).catch(function (e) { o.status = old; toast(t("errGeneric") + errMsg(e)); }).then(function () { if (S.adm.page === "orders" && $("#ordRes")) renderOrdersResults(); });
  }

  /* ================= events ================= */
  document.addEventListener("click", function (e) {
    var mb = e.target.closest("[data-mback]");
    if (mb && e.target === mb) { closeModal(); return; }
    if (!e.target.closest("#storesDD")) setMenu(false);
    if (e.target.id === "overlay") { closeCart(); return; }
    var el = e.target.closest("button, a");
    if (!el) return;
    if (el.classList.contains("logo")) { e.preventDefault(); if (S.route !== "shop") setRoute("shop"); window.scrollTo(0, 0); return; }
    var ds = el.dataset;
    if (ds.lang) { S.lang = ds.lang; try { localStorage.setItem("barbara-lang", S.lang); } catch (x) {} applyStatic(); renderCats(); renderGrid(); renderDrawer(); if (S.route === "admin") { closeModal(); renderAdmin(); } return; }
    if (ds.route) { setRoute(ds.route); return; }
    /* storefront */
    if (ds.cat) { S.cat = ds.cat; renderCats(); renderGrid(); $("#products").scrollIntoView({ behavior: "smooth" }); return; }
    if (ds.add) { S.cart[ds.add] = (S.cart[ds.add] || 0) + 1; saveCart(); renderDrawer(); toast(t("added")); return; }
    if (ds.inc) { S.cart[ds.inc]++; saveCart(); renderDrawer(); return; }
    if (ds.dec) { S.cart[ds.dec]--; if (S.cart[ds.dec] <= 0) delete S.cart[ds.dec]; saveCart(); renderDrawer(); return; }
    if (ds.rm) { delete S.cart[ds.rm]; saveCart(); renderDrawer(); return; }
    /* admin */
    if (ds.page) { S.adm.page = ds.page; S.adm.confirm = null; renderAdmin(); return; }
    if (ds.ofilter) { S.adm.fo.status = ds.ofilter; renderOrdersResults(); return; }
    if (ds.openOrder) { openOrderModal(ds.openOrder); return; }
    if (ds.closeModal !== undefined) { closeModal(); return; }
    if (ds.delOrder) { var k = "del-order:" + ds.delOrder; if (S.adm.confirm === k) { var did = ds.delOrder; S.adm.confirm = null; DB.deleteOrder(did).then(function () { S.adm.orders = S.adm.orders.filter(function (o) { return o.id !== did; }); closeModal(); toast(t("deleted")); if (S.adm.page === "orders") { refreshSellers(); renderOrdersResults(); } }).catch(function (er) { toast(t("errGeneric") + errMsg(er)); }); } else arm(k, redrawFor(k)); return; }
    if (ds.addProduct !== undefined) { openProductModal(null); return; }
    if (ds.editProduct) { openProductModal(ds.editProduct); return; }
    if (ds.delProduct) { var kp = "del-prod:" + ds.delProduct; if (S.adm.confirm === kp) { var pid = ds.delProduct; S.adm.confirm = null; DB.deleteProduct(pid).then(function () { toast(t("deleted")); return reloadProducts(); }).catch(function (er) { toast(t("errGeneric") + errMsg(er)); }); } else arm(kp, redrawFor(kp)); return; }
    if (ds.toggleVis) {
      var p = S.products.filter(function (x) { return x.id === ds.toggleVis; })[0]; if (!p) return;
      var nv = !p.visible; p.visible = nv; renderProductsResults();
      DB.saveProduct({ id: p.id, name_fr: p.name_fr, name_ar: p.name_ar, category: p.category, price: p.price, points: p.points, visible: nv, image_url: p.image_url }).catch(function (er) { p.visible = !nv; renderProductsResults(); toast(t("errGeneric") + errMsg(er)); });
      return;
    }
    switch (el.id) {
      case "pf-vis": var on = el.getAttribute("aria-checked") !== "true"; el.setAttribute("aria-checked", String(on)); var l = $("#pf-vis-l"); l.textContent = on ? t("visible") : t("hidden"); l.classList.toggle("on", on); return;
      case "ofreset": S.adm.fo = { status: "all", from: "", to: "", seller: "all", q: "" }; renderOrdersPage(); return;
      case "admLogout": DB.signOut().then(function () { stopAdminLive(); S.adm.ok = false; S.adm.email = ""; renderAdmin(); }); return;
      case "reloadShop": S.loadErr = false; renderGrid(); loadShop(); return;
      case "cartBtn": openCart(); return;
      case "closeCart": closeCart(); return;
      case "goCheckout": S.dv = "form"; S.errors = {}; renderDrawer(); var f1 = $("#f-name"); if (f1) f1.focus(); return;
      case "backCart": S.dv = "cart"; renderDrawer(); return;
      case "doneClose": closeCart(); return;
      case "accountBtn": toast(t("accountMsg")); return;
      case "storesBtn": setMenu($("#storesMenu").hidden); return;
      case "adminLink": setRoute("admin"); return;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    setMenu(false); if (modalOpen()) { closeModal(); return; } if (!$("#drawer").hidden) closeCart();
  });
  document.addEventListener("input", function (e) {
    var el = e.target, id = el.id;
    if (id === "q") { S.q = el.value; renderGrid(); return; }
    if (id === "ofq") { S.adm.fo.q = el.value; renderOrdersResults(); return; }
    if (id === "pfq") { S.adm.fp.q = el.value; renderProductsResults(); return; }
    var f = el.dataset && el.dataset.f;
    if (f) { S.form[f] = el.value; if (S.errors[f]) { delete S.errors[f]; var er = $("#e-" + f); if (er) er.hidden = true; el.removeAttribute("aria-invalid"); } }
  });
  document.addEventListener("change", function (e) {
    var el = e.target, id = el.id;
    if (el.dataset && el.dataset.ostatus) { setStatus(el.dataset.ostatus, el.value, el); return; }
    if (id === "off") { S.adm.fo.from = el.value; renderOrdersResults(); }
    else if (id === "oft") { S.adm.fo.to = el.value; renderOrdersResults(); }
    else if (id === "ofs") { S.adm.fo.seller = el.value; renderOrdersResults(); }
    else if (id === "pfc") { S.adm.fp.cat = el.value; renderProductsResults(); }
    else if (id === "pf-file" && el.files[0]) { var prev = $("#pf-prev"); try { prev.innerHTML = '<img src="' + URL.createObjectURL(el.files[0]) + '" alt="">'; } catch (x) {} }
  });
  document.addEventListener("submit", function (e) {
    var id = e.target.id;
    if (id === "searchForm") { e.preventDefault(); S.q = $("#q").value; renderGrid(); $("#products").scrollIntoView({ behavior: "smooth" }); }
    else if (id === "orderForm") { e.preventDefault(); placeOrder(); }
    else if (id === "prodForm") { e.preventDefault(); saveProductForm(); }
    else if (id === "setForm") { e.preventDefault(); saveSettingsForm(); }
    else if (id === "admLogin") {
      e.preventDefault();
      var btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
      DB.signIn($("#lg-email").value.trim(), $("#lg-pw").value).then(function (u) {
        S.adm.ok = true; S.adm.email = u.email; S.adm.loginErr = ""; return loadAdminData().then(function () { startAdminLive(); renderAdmin(); });
      }).catch(function (er) { S.adm.loginErr = errMsg(er) === "not_admin" ? t("notAdmin") : t("authFail"); renderAdmin(); });
    }
  });
  window.addEventListener("hashchange", function () { var h = location.hash === "#admin"; if (h && S.route !== "admin") enterAdmin(); else if (!h && S.route === "admin") leaveAdmin(); });

  /* ================= start ================= */
  setLogos();
  applyStatic(); renderCats(); renderGrid(); renderDrawer();
  loadShop();
  DB.subscribe(["products", "settings"], function () { if (S.route === "shop") loadShop(); });
  if (location.hash === "#admin") enterAdmin();
})();
</script>

</html>
